<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Ticket</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_ticket.css') }}">
</head>

<body>

    <main class="container">

        <div class="page-header">

            <div>
                <h1>Editar Ticket</h1>
                <p>Actualiza la información de la solicitud</p>
            </div>

            <a href="/tickets" class="btn-back">
                ← Volver a Tickets
            </a>

        </div>

        <div class="form-card">

            {% if mensaje %}
                <div class="message">
                    {{ mensaje }}
                </div>
            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label for="titulo">
                        Título del ticket
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        value="{{ ticket.titulo }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="tecnico">
                        Técnico
                    </label>

                    <input
                        type="text"
                        id="tecnico"
                        name="tecnico"
                        value="{{ ticket.tecnico }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="estado">
                        Estado
                    </label>

                    <select id="estado" name="estado">

                        <option value="pendiente"
                            {% if ticket.estado == "pendiente" %}selected{% endif %}>
                            Pendiente
                        </option>

                        <option value="en proceso"
                            {% if ticket.estado == "en proceso" %}selected{% endif %}>
                            En proceso
                        </option>

                        <option value="resuelto"
                            {% if ticket.estado == "resuelto" %}selected{% endif %}>
                            Resuelto
                        </option>

                    </select>

                </div>

                <div class="form-actions">

                    <a href="/tickets" class="btn-cancel">
                        Cancelar
                    </a>

                    <button type="submit" class="btn-submit">
                        Guardar cambios
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
