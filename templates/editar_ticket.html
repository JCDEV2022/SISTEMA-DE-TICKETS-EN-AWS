<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Ticket</title>
</head>
<body>


<h1>Editar Ticket</h1>

{% if mensaje %}
    <p>{{ mensaje }}</p>
{% endif %}

<form method="POST">

    <label>Título:</label>
    <input
        type="text"
        name="titulo"
        value="{{ ticket.titulo }}"
    >

    <br><br>

    <label>Técnico:</label>
    <input
        type="text"
        name="tecnico"
        value="{{ ticket.tecnico }}"
    >

    <br><br>

    <label>Estado:</label>

    <select name="estado">

        <option value="pendiente"
            {% if ticket.estado == "pendiente" %}selected{% endif %}>
            Pendiente
        </option>

        <option value="en proceso"
            {% if ticket.estado == "en proceso" %}selected{% endif %}>
            En proceso
        </option>

        <option value="resuelto"
            {% if ticket.estado == "resuelto" %}selected{% endif %}>
            Resuelto
        </option>

    </select>

    <br><br>

    <button type="submit">Guardar cambios</button>

</form>

<br>

<a href="/tickets">Volver a tickets</a>


</body>
</html>
